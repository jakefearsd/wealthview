name: wealthview-loadtest

services:
  loadtest-db:
    image: postgres:16
    environment:
      POSTGRES_DB: wealthview_loadtest
      POSTGRES_USER: wv_loadtest
      POSTGRES_PASSWORD: loadtest_local_pw
    ports:
      - "5434:5432"
    volumes:
      - loadtest-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wv_loadtest -d wealthview_loadtest"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot init: the bind-mounted ./results dir is created root-owned by the
  # Docker daemon on a fresh checkout (the dir is gitignored, so it may not
  # exist), but the app image runs as the non-root `wv` user (uid 100) and must
  # write manifest.json there. This makes the mount point world-writable before
  # the app boots. Runs to completion, then the app starts.
  loadtest-results-init:
    image: alpine:3
    command: ["sh", "-c", "mkdir -p /loadtest/results && chmod 777 /loadtest/results"]
    volumes:
      - ./results:/loadtest/results

  loadtest-app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      loadtest-db:
        condition: service_healthy
      loadtest-results-init:
        condition: service_completed_successfully
      pyroscope:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      LOADTEST_DB_URL: jdbc:postgresql://loadtest-db:5432/wealthview_loadtest
      LOADTEST_DB_USER: wv_loadtest
      LOADTEST_DB_PASSWORD: loadtest_local_pw
      LOADTEST_TENANTS: ${LOADTEST_TENANTS:-25}
      LOADTEST_TXNS_PER_TENANT: ${LOADTEST_TXNS_PER_TENANT:-1500}
      LOADTEST_HIKARI_MAX: ${LOADTEST_HIKARI_MAX:-20}
      LOADTEST_MANIFEST_PATH: /loadtest/results/manifest.json
      # Required boot env vars for the base application.yml under the loadtest
      # profile. These are obviously-fake, loadtest-only values — never real
      # secrets. The loadtest profile is NOT prod/docker, so
      # ProductionConfigValidator does not run; SuperAdminInitializer is also
      # gated to dev/docker/prod so app.super-admin.* is not required here.
      #
      # JWT signing key — base application.yml has ${JWT_SECRET} with no default
      # (HS256 requires >= 32 chars).
      JWT_SECRET: loadtest-only-fake-jwt-secret-min-32-characters-long-xxxx
      # MFA TOTP-secret encryption key — base application.yml has
      # ${MFA_ENCRYPTION_KEY} with no default (base64-encoded 32-byte AES key).
      # This is base64("LOADTEST-ONLY-FAKE-MFA-KEY-32BYT").
      MFA_ENCRYPTION_KEY: TE9BRFRFU1QtT05MWS1GQUtFLU1GQS1LRVktMzJCWVQ=
      # Auth uses Secure cookies by default; the smoke check hits plain http on
      # 8081, so disable the Secure flag for the loadtest stack.
      APP_COOKIE_SECURE: "false"
      # Disable the per-IP / per-user request rate limiter for the loadtest
      # stack. RateLimitFilter caps auth endpoints at 60/min PER IP and API
      # endpoints at 300/min PER user; under a multi-VU ramp every k6 VU shares
      # one source IP, so logins get 429'd, VUs end up unauthenticated, and the
      # hot-path scenario can't reach the projection/optimize endpoints we're
      # here to profile. The harness measures app/DB/CPU capacity, not the rate
      # limiter, so it is turned off here. (matchIfMissing=true means the filter
      # is on by default; this property is what disables it.)
      APP_RATE_LIMIT_ENABLED: "false"
      # Continuous JVM profiling via the Pyroscope Java agent. The agent jar is
      # mounted (not baked into the image) and attached through JAVA_TOOL_OPTIONS,
      # which the JVM honors additively on top of the ENTRYPOINT (`java -jar
      # app.jar`). itimer mode is signal-based (NOT perf_events), so it works in
      # an unprivileged container without extra capabilities.
      JAVA_TOOL_OPTIONS: "-javaagent:/pyroscope/pyroscope.jar"
      PYROSCOPE_APPLICATION_NAME: wealthview-loadtest
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_PROFILING_INTERVAL: 10ms
      PYROSCOPE_PROFILER_EVENT: itimer
      PYROSCOPE_PROFILER_ALLOC: 512k
      PYROSCOPE_PROFILER_LOCK: 10ms
      PYROSCOPE_FORMAT: jfr
    volumes:
      - ./results:/loadtest/results
      - ./observability/pyroscope:/pyroscope:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --web.enable-admin-api
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://wv_loadtest:loadtest_local_pw@loadtest-db:5432/wealthview_loadtest?sslmode=disable"
    depends_on:
      loadtest-db:
        condition: service_healthy

  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - "4040:4040"

  k6:
    image: grafana/k6:latest
    profiles: ["k6"]
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99)"
      BASE_URL: http://loadtest-app:8080
      MANIFEST_PATH: /loadtest/results/manifest.json
    volumes:
      - ./scenarios/dist:/scripts:ro
      - ./results:/loadtest/results
    depends_on:
      loadtest-app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - pyroscope

volumes:
  loadtest-db-data:
  prometheus-data:
