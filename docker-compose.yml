services:
  db:
    # Pinned by digest (postgres:18, server version 18.7 at time of pin).
    image: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
    environment:
      POSTGRES_DB: wealthview
      POSTGRES_USER: wv_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA at /var/lib/postgresql/18/docker and
      # declare the VOLUME one level up, so the mount is /var/lib/postgresql (a
      # mount at .../data, the 16-and-older layout, no longer works).
      #
      # pgdata18, not pgdata: an 18 server cannot open a 16 data directory, so
      # the major upgrade is dump + restore into a fresh volume. The old
      # `pgdata` volume is left untouched as the rollback copy. See
      # docs/deployment/upgrading.md, "PostgreSQL major upgrades".
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wv_app -d wealthview"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wealthview
      SPRING_DATASOURCE_USERNAME: wv_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (32+ chars)}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set in .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set in .env (openssl rand -base64 32)}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      APP_ZILLOW_ENABLED: ${ZILLOW_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # Holds the PostgreSQL 16 cluster from before the 18 upgrade. Unused by any
  # service; kept so a rollback (or a re-run of the dump) is still possible.
  # Remove it with `docker volume rm <project>_pgdata` once 18 is settled.
  pgdata:
  pgdata18:
