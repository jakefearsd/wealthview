services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wealthview
      POSTGRES_USER: wv_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LOCAL_DEV_NOT_A_REAL_PASSWORD_OVERRIDE_VIA_ENV}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
