name: Backend Release Verify

# Runs ONLY when a version tag (v*) is created (plus a manual workflow_dispatch
# escape hatch). Full backend verification on a GitHub-hosted runner: unit +
# Failsafe integration tests + the enforced PMD/CPD/SpotBugs/Checkstyle/JaCoCo
# gates (all bound to the verify phase), then a Docker image build to confirm
# the release image assembles. No deploy — deployment is performed on the
# server via `./wv update` (a GitHub-hosted runner cannot reach the host box).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure Docker API version for Testcontainers
        run: |
          # docker-java defaults to API v1.32, which modern Docker daemons reject;
          # force a version both the runner's Docker and Testcontainers support.
          for dir in backend/*/src/test/resources; do
            mkdir -p "$dir"
            echo "api.version=1.44" > "$dir/docker-java.properties"
          done

      - name: Verify (unit + integration tests + quality gates)
        # rerunFailingTestsCount retries a transient integration-test failure (the
        # Testcontainers IT suite can occasionally flake on small shared CI runners)
        # before failing the build. Deterministic gate/unit failures still fail.
        run: mvn -f backend/pom.xml clean verify -B -Dfailsafe.rerunFailingTestsCount=2

      - name: Build release Docker image
        run: docker build -t "wealthview:${{ github.ref_name }}" .
