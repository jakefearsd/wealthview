name: Backend Release Verify

# Runs ONLY when a version tag (v*) is created (plus a manual workflow_dispatch
# escape hatch). Full backend verification on GitHub-hosted runners, split into
# jobs so a fast-gate failure short-circuits before the slower Testcontainers
# integration suite spins up:
#   1. verify             - unit tests + @DataJpaTest Testcontainers tests +
#                            the enforced PMD/CPD/SpotBugs/Checkstyle/JaCoCo
#                            quality gates (mvn verify -DskipITs).
#   2. integration-tests   - needs: verify. The wealthview-app Failsafe/HTTP
#                            integration suite against a Testcontainers
#                            PostgreSQL instance (mvn verify -pl wealthview-app,
#                            no -DskipITs). This used to be skipped on CI
#                            because the O(n^2) price rescan in
#                            StockSplitService.unapplySplit made StockSplitIT
#                            time out on free 2-core runners; that regression
#                            was fixed 2026-07-02 (StockSplitIT: 188s -> 24s
#                            locally), so tag builds now gate on the full IT
#                            suite here instead of requiring a manual local
#                            `mvn verify` before tagging.
#   3. docker-image        - needs: [verify, integration-tests]. Builds the
#                            release image only after both test jobs pass, then
#                            pushes it to GHCR as
#                            ghcr.io/<owner>/wealthview:<version> and :latest,
#                            and cuts a GitHub Release whose notes are lifted
#                            from the matching CHANGELOG section.
#                            Publishing happens ONLY for refs/tags/v*; a manual
#                            workflow_dispatch still builds (proving the image
#                            assembles) but never pushes, so it cannot move
#                            :latest or invent an untagged version.
#                            Still no deploy: a GitHub-hosted runner cannot
#                            reach the host box. The server pulls the published
#                            image via `wv update`.
#
# GHCR VISIBILITY: the package inherits the repository's visibility. This repo
# is public, so the package is public and any server pulls it anonymously — no
# login, no setup. Only a private fork or mirror needs a read:packages PAT on
# the server. See docs/deployment/upgrading.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    name: Unit tests + quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure Docker API version for Testcontainers
        run: |
          # docker-java defaults to API v1.32, which modern Docker daemons reject;
          # force a version both the runner's Docker and Testcontainers support.
          for dir in backend/*/src/test/resources; do
            mkdir -p "$dir"
            echo "api.version=1.44" > "$dir/docker-java.properties"
          done

      - name: Verify (unit tests + @DataJpaTest + quality gates)
        # -DskipITs skips the app-module HTTP Failsafe integration tests, which
        # now run in the integration-tests job below instead of being skipped
        # outright. Keeping this job IT-free means PMD/CPD/SpotBugs/Checkstyle/
        # JaCoCo and unit-test failures surface quickly, before the slower IT
        # suite spends runner time on a build that was already going to fail.
        run: mvn -f backend/pom.xml clean verify -B -DskipITs

  integration-tests:
    name: Full Testcontainers integration suite
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure Docker API version for Testcontainers
        run: |
          # See matching step in the verify job: same Testcontainers API-version
          # pin is needed here since AbstractApiIntegrationTest also boots a
          # Testcontainers PostgreSQL instance.
          for dir in backend/*/src/test/resources; do
            mkdir -p "$dir"
            echo "api.version=1.44" > "$dir/docker-java.properties"
          done

      - name: Install reactor (skip ITs) so wealthview-app resolves sibling modules
        # This is a separate job/runner/checkout from `verify`, so the local
        # Maven repo has no installed wealthview-* artifacts yet. Build and
        # install the whole reactor first (still skipping ITs) so the
        # wealthview-app-only `verify` below can resolve its sibling-module
        # dependencies without needing -am.
        run: mvn -f backend/pom.xml clean install -B -DskipITs

      - name: Verify wealthview-app (Failsafe integration tests)
        # No -DskipITs here: this is the full HTTP Testcontainers-backed IT
        # suite (AbstractApiIntegrationTest and friends) that CI previously
        # skipped entirely. Locally this module's Failsafe run is ~24s
        # post-fix (was 188s); the 45-minute job timeout above gives generous
        # headroom for a shared 2-core runner plus Testcontainers image pulls.
        # rerunFailingTestsCount: bounded mitigation for a rare, CI-only
        # query-visibility anomaly in StockSplitBackfillIT (t28b round 4:
        # locally irreproducible after 40+ attempts; the zero-tenant WARN
        # diagnostic captures evidence on any recurrence). Retries surface
        # as flakes in the Failsafe report rather than passing silently.
        run: mvn -f backend/pom.xml verify -pl wealthview-app -B -Dfailsafe.rerunFailingTestsCount=2

  docker-image:
    name: Build and publish release image
    needs: [verify, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Derive version and publish decision
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # refs/tags/v1.2.5 -> 1.2.5
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch on a branch: still prove the image assembles,
            # but never publish — a manual run must not move :latest or claim
            # a version number that was never tagged.
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # amd64 only, deliberately. The Dockerfile compiles the entire Maven
      # backend inside the build stage, so an emulated arm64 build runs the
      # whole reactor under QEMU and takes 30-60+ minutes. If an arm64 target
      # is ever needed, add linux/arm64 here AND raise timeout-minutes — and
      # re-check the digest-pinned base images resolve on that platform.
      - name: Log in to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/wealthview:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/wealthview:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=WealthView
            org.opencontainers.image.description=Self-hosted multi-tenant personal finance platform
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract release notes from CHANGELOG
        if: steps.meta.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          # Lines from "## [VERSION]" up to the next "## [" header.
          awk -v v="${version}" '
              $0 ~ "^## \\[" v "\\]" { capture = 1; next }
              capture && /^## \[/     { exit }
              capture                 { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG section for ${version}; falling back." >&2
            printf 'See [CHANGELOG.md](CHANGELOG.md) for details.\n' > release-notes.md
          fi
          {
            printf '\n---\n\n## Deploying this release\n\n'
            printf 'On the server, set the version in the env file and update:\n\n'
            printf '```bash\n'
            printf 'sed -i "s/^WEALTHVIEW_VERSION=.*/WEALTHVIEW_VERSION=%s/" /etc/wealthview/.env\n' "${version}"
            printf 'wv update\n'
            printf '```\n\n'
            printf 'Image: `ghcr.io/%s/wealthview:%s`\n' "${{ github.repository_owner }}" "${version}"
          } >> release-notes.md

      - name: Create GitHub Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: WealthView ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          # Tags below 1.0.0 are marked as pre-releases automatically.
          prerelease: ${{ startsWith(steps.meta.outputs.version, '0.') }}
