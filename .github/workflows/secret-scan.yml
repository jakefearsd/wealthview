name: Secret Scan

# Runs ONLY when a version tag (v*) is created. workflow_dispatch is a manual
# escape hatch and never triggers automatically. (The local pre-commit gitleaks
# hook still scans every commit before it lands.)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GL_VER="8.21.2"
          if ! command -v gitleaks >/dev/null 2>&1 || ! gitleaks version 2>&1 | grep -q "$GL_VER"; then
            tmp=$(mktemp -d)
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
              -o "$tmp/gl.tgz"
            tar -xzf "$tmp/gl.tgz" -C "$tmp"
            install -m755 "$tmp/gitleaks" "$HOME/.local/bin/gitleaks"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan repository history
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --exit-code 1

      - name: Upload SARIF report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
