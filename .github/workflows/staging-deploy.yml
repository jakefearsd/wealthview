name: Staging Deploy

# Builds + deploys ONLY when a version tag (v*) is created. workflow_dispatch is
# a manual re-run escape hatch and never triggers automatically.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: staging-wealthview
  cancel-in-progress: true

env:
  DOCKER_HOST: unix:///var/run/docker.sock

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker API version for Testcontainers
        run: |
          # docker-java defaults to API v1.32, but Docker 29.x requires >= 1.40
          for dir in backend/*/src/test/resources; do
            mkdir -p "$dir"
            echo "api.version=1.44" > "$dir/docker-java.properties"
          done

      - name: Run full verification (unit + integration tests + quality gates)
        # `verify` (not `test`) so the release build runs the Failsafe integration
        # tests and the enforced PMD/CPD/SpotBugs/Checkstyle/JaCoCo gates, which
        # are bound to the verify phase. Testcontainers needs Docker (self-hosted).
        run: cd backend && mvn clean verify -B

  build-and-deploy:
    needs: test
    runs-on: self-hosted
    env:
      STAGING_DIR: /home/jakefear/staging/wealthview
      IMAGE_NAME: wealthview
      IMAGE_TAG: staging

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Deploy to staging
        run: |
          cd $STAGING_DIR
          docker compose down
          docker compose up -d

      - name: Wait for healthy
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "Staging is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "WARNING: Health check timed out after 150s"
          docker compose -f $STAGING_DIR/docker-compose.yml logs app --tail 50
          exit 1

      - name: Clean up old images
        if: always()
        run: docker image prune -f --filter "until=168h"
