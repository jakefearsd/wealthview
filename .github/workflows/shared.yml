name: Shared Workspace

# Builds run ONLY when a version tag (v*) is created. workflow_dispatch is a
# manual re-run escape hatch and never triggers automatically.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace shared

      - name: Test
        run: npm run test --workspace shared
