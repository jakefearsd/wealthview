name: Mobile App

# Linux CI runs typecheck + Jest only. Android Gradle and iOS xcodebuild
# happen locally on a developer machine — see mobile/README.md.

# Builds run ONLY when a version tag (v*) is created. workflow_dispatch is a
# manual re-run escape hatch and never triggers automatically.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace mobile

      - name: Test
        run: npm run test --workspace mobile
