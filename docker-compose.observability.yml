# Optional observability stack — Prometheus + Grafana.
#
# Use alongside the production compose:
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Required env vars:
#   GRAFANA_ADMIN_PASSWORD  — Grafana admin login (no fallback; Grafana refuses to start without it)
#
# SECURITY NOTE — read before enabling this overlay.
# This overlay sets app.observability.anonymous-metrics=true, which serves
# /actuator/prometheus and /actuator/metrics WITHOUT authentication. It has to:
# the app authenticates with a JWT only (no HTTP Basic, no UserDetailsService), so a
# scraper has no credential it can present. Previously this file passed basic-auth
# credentials that the app could not accept, so every scrape 401'd and the stack
# collected nothing at all.
#
# Those endpoints are reachable only on the compose network — they are NOT published
# to the host here. Keep it that way: do not publish the app's port directly to the
# internet, and block /actuator at your reverse proxy. Metrics carry no tenant or user
# identity (see MetricsConfig), but they do expose request URIs and volumes.
#
# Prometheus scrapes the app on the user-defined Docker network. Grafana ships with a
# pre-provisioned datasource pointing at Prometheus and one dashboard at
# infra/observability/grafana/dashboards/wealthview.json.
services:
  # Merged into the app service defined by the base compose file.
  app:
    environment:
      APP_OBSERVABILITY_ANONYMOUS_METRICS: "true"

  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
