services:
  db:
    # Pinned by digest (postgres:16, server version 16.15 at time of pin).
    image: postgres:16@sha256:56f243d2355bad7d2016b1e78b80da8ac9e7967b766be2bfbff84fe85ffa30bc
    environment:
      POSTGRES_DB: wealthview
      POSTGRES_USER: wv_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wv_app -d wealthview"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # Pulled from GHCR — released by .github/workflows/backend-verify.yml on a
    # v* tag. There is deliberately no `build:` key here: the production host is
    # not expected to have the source tree or a JDK (see `wv help`), and building
    # on the server meant deploying an artifact no CI job had ever verified.
    #
    # WEALTHVIEW_IMAGE exists so a fork, a private mirror, or an air-gapped host
    # can point at a different registry without editing this file.
    #
    # Pin a real version. `latest` is published too, but deploying it defeats
    # `wv rollback`, which recovers by re-pinning the previously running tag.
    image: ${WEALTHVIEW_IMAGE:-ghcr.io/jakefearsd/wealthview}:${WEALTHVIEW_VERSION:?WEALTHVIEW_VERSION must be set in .env (use a version like 1.2.5 or a digest like sha256-... — never deploy :latest)}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wealthview
      SPRING_DATASOURCE_USERNAME: wv_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (32+ chars)}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set in .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set in .env (openssl rand -base64 32)}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      APP_ZILLOW_ENABLED: ${ZILLOW_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:8080"
    # No healthcheck override here on purpose. The image's own HEALTHCHECK
    # (see Dockerfile) already probes /actuator/health with wget — curl is NOT
    # present in the eclipse-temurin:25-jre-alpine runtime, so the old
    # `["CMD","curl",...]` override made the container report permanently
    # unhealthy. Keeping exactly one definition, in the Dockerfile, stops the
    # two copies from drifting apart again.
    restart: unless-stopped

  backup:
    build: ./infra/backup
    environment:
      PGHOST: db
      PGUSER: wv_app
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      PGDATABASE: wealthview
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
