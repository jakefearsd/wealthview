services:
  db:
    # Pinned by digest (postgres:16, server version 16.15 at time of pin).
    image: postgres:16@sha256:56f243d2355bad7d2016b1e78b80da8ac9e7967b766be2bfbff84fe85ffa30bc
    environment:
      POSTGRES_DB: wealthview
      POSTGRES_USER: wv_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wv_app -d wealthview"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: wealthview:${WEALTHVIEW_VERSION:?WEALTHVIEW_VERSION must be set in .env (use a version like 1.0.0 or a digest like sha256-... — never deploy :latest)}
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wealthview
      SPRING_DATASOURCE_USERNAME: wv_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      APP_ZILLOW_ENABLED: ${ZILLOW_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backup:
    build: ./infra/backup
    environment:
      PGHOST: db
      PGUSER: wv_app
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: wealthview
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
