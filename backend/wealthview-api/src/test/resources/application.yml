spring:
  jackson:
    # Native Jackson 3 (tools.jackson) config for the @WebMvcTest slice, mirroring
    # the app's base profile so controller-test request/response bodies match the
    # real wire format: snake_case field names, ISO-8601 date/duration strings
    # (write-dates flags live under datatype.datetime in Jackson 3), lenient unknown
    # properties, and no @JsonView default inclusion. The @Autowired ObjectMapper
    # injected into controller tests is this same auto-configured mapper.
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
    mapper:
      default-view-inclusion: false
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-durations-as-timestamps: false
