spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Native Jackson 3 wire config. The date/duration timestamp toggles,
    # lenient-unknown-properties, and view-inclusion settings are inherited from the
    # app's base application.yml (deep-merged for the "it" profile); snake_case is
    # restated here for clarity.
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cookie:
    secure: false
  rate-limit:
    enabled: false
  jwt:
    secret: INTEGRATION_TEST_HS256_SIGNING_KEY_FIXED_VALUE_FOR_TEST_DETERMINISM_ONLY
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000
  mfa:
    encryption-key: REVWRUxPUE1FTlQtT05MWS1NRkEtS0VZLTMyLUJZVEU=
  finnhub:
    api-key: ""
  zillow:
    enabled: false
  stock-splits:
    # Disable StockSplitBackfillRunner's ContextRefreshedEvent auto-run: its
    # asynchronous startup execution raced the split ITs' stubbed fixtures on
    # 2-core hosted runners (runs 29195289770 / 29197264627 / 29198018267 /
    # 29200037679), consuming queued splits and re-writing backfill_completed
    # mid-test. The split ITs drive runIfNeeded() explicitly; production
    # default is true (see StockSplitBackfillRunnerTest's default-pin test).
    backfill-auto-run: false

logging:
  level:
    com.wealthview: WARN
    # INFO for the split package so CI logs show the backfill runner's
    # startup auto-run lifecycle ("backfill starting" / "N symbols scanned,
    # M splits applied" / "Applied split ..."). StockSplitBackfillIT failed
    # on hosted 2-core runners with a silent signature that WARN-level logs
    # could not distinguish (see runs 29195289770 / 29198018267); keeping
    # this at INFO makes any recurrence diagnosable from the CI log alone.
    com.wealthview.core.split: INFO
