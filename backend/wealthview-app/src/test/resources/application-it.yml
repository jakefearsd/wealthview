spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Boot 4 defaults to Jackson 3. use-jackson2-defaults restores the
    # Jackson-2-compatible wire behavior (dropped the explicit
    # serialization.write-dates-as-timestamps: false, which no longer binds under
    # Jackson 3's SerializationFeature). Mirrors the app's base profile.
    use-jackson2-defaults: true
    property-naming-strategy: SNAKE_CASE
  jackson2:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cookie:
    secure: false
  rate-limit:
    enabled: false
  jwt:
    secret: INTEGRATION_TEST_HS256_SIGNING_KEY_FIXED_VALUE_FOR_TEST_DETERMINISM_ONLY
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000
  mfa:
    encryption-key: REVWRUxPUE1FTlQtT05MWS1NRkEtS0VZLTMyLUJZVEU=
  finnhub:
    api-key: ""
  zillow:
    enabled: false

logging:
  level:
    com.wealthview: WARN
