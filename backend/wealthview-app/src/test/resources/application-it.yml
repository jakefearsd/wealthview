spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cookie:
    secure: false
  rate-limit:
    enabled: false
  jwt:
    secret: INTEGRATION_TEST_HS256_SIGNING_KEY_FIXED_VALUE_FOR_TEST_DETERMINISM_ONLY
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000
  finnhub:
    api-key: ""
  zillow:
    enabled: false

logging:
  level:
    com.wealthview: WARN
