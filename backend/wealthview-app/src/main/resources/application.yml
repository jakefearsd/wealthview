spring:
  lifecycle:
    # Cap how long graceful shutdown waits for the SmartLifecycle phase that
    # drains the web server before forcing termination. Matches the default
    # 30s SIGTERM grace period most orchestrators allow.
    timeout-per-shutdown-phase: 25s
  datasource:
    url: jdbc:postgresql://localhost:5433/wealthview
    username: wv_app
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 500
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Boot 4 defaults to Jackson 3 (tools.jackson). use-jackson2-defaults keeps
    # the wire format Jackson-2-compatible: it configures the mapper via
    # builder.configureForJackson2(), which disables WRITE_DATES_AS_TIMESTAMPS /
    # WRITE_DURATIONS_AS_TIMESTAMPS and FAIL_ON_UNKNOWN_PROPERTIES — the behavior
    # the old explicit serialization.write-dates-as-timestamps: false gave us.
    # That key is dropped here because Jackson 3 moved the flag off
    # SerializationFeature onto DateTimeFeature, so binding it under
    # spring.jackson.serialization now fails. property-naming-strategy keeps
    # responses snake_case. The Jackson 3 source migration is a separate phase.
    use-jackson2-defaults: true
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  # Common tags (application, env) are added programmatically by
  # MetricsConfig.CommonTagsCustomizer so they apply uniformly across all
  # registries (including SimpleMeterRegistry used in tests).
  tracing:
    # Off by default. Operators turn it on with MANAGEMENT_TRACING_ENABLED=true
    # plus an OTLP endpoint (OTEL_EXPORTER_OTLP_ENDPOINT). Sampling defaults
    # to 10%; set MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0 to capture every
    # request when investigating an incident. See docs/OBSERVABILITY.md.
    enabled: false
    sampling:
      probability: 0.1
  otlp:
    tracing:
      # Only used when tracing is enabled. Default points at a typical local
      # OpenTelemetry Collector / Tempo gRPC port; production deployments
      # override via OTEL_EXPORTER_OTLP_ENDPOINT.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

server:
  port: 8080
  # Graceful shutdown: in-flight requests are allowed to complete before the
  # JVM exits. Spring Boot's lifecycle then drains the Hikari pool and
  # ThreadPoolTaskScheduler. Containers should send SIGTERM (Docker / k8s do
  # this by default) rather than SIGKILL to honor this.
  shutdown: graceful

app:
  cookie:
    # When true, auth cookies and the CSRF cookie carry the Secure flag and
    # are only sent over HTTPS. Override to false in dev/integration profiles
    # so local-http development still works.
    secure: true
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000
  mfa:
    # Base64-encoded 32-byte AES-256-GCM key used to encrypt TOTP shared
    # secrets at rest. Generate with `openssl rand -base64 32`. Required in
    # production (no fallback); ProductionConfigValidator rejects known dev
    # defaults. Local dev/it profiles inject a deterministic sentinel.
    encryption-key: ${MFA_ENCRYPTION_KEY}
  finnhub:
    api-key: ${FINNHUB_API_KEY:}
    base-url: https://finnhub.io
    rate-limit-ms: 1100
  zillow:
    enabled: false
    timeout-ms: 10000
    rate-limit-ms: 5000
    sync-cron: "0 0 6 * * SUN"
