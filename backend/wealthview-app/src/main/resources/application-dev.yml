spring:
  datasource:
    password: ${DB_PASSWORD:LOCAL_DEV_NOT_A_REAL_PASSWORD_OVERRIDE_VIA_ENV}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 100

logging:
  level:
    com.wealthview: DEBUG

app:
  cookie:
    secure: false
  cors:
    allowed-origins: http://localhost:5173
  super-admin:
    email: admin@wealthview.local
    password: ${SUPER_ADMIN_PASSWORD:LOCAL_DEV_NOT_A_REAL_PASSWORD_OVERRIDE_VIA_ENV}
  jwt:
    secret: ${JWT_SECRET:LOCAL_DEV_HS256_SIGNING_KEY_NOT_FOR_PRODUCTION_USE_ONLY_FOR_DEVELOPMENT}
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000
  mfa:
    # Dev sentinel: base64 of "DEVELOPMENT-ONLY-MFA-KEY-32-BYTE". Not a
    # real key. ProductionConfigValidator rejects this exact value when
    # the prod/docker profile is active, so it can never reach production.
    encryption-key: ${MFA_ENCRYPTION_KEY:REVWRUxPUE1FTlQtT05MWS1NRkEtS0VZLTMyLUJZVEU=}
  zillow:
    enabled: true
