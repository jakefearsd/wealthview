<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      Subresource Integrity (SRI) rule: this page currently loads zero
      third-party CDN assets (fonts, scripts, stylesheets) — everything is
      bundled by Vite and served same-origin. If a CDN asset (Google Fonts, a
      script tag, etc.) is ever added here, it MUST carry
      integrity="sha384-..." and crossorigin="anonymous" so a compromised or
      MITM'd CDN response can't execute unverified code in the app's origin.
      See docs/deployment/security-hardening.md.
    -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WealthView</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* Remove number input spinner arrows */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
